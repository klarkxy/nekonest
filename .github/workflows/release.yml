name: Release binaries

run-name: Release binaries for ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to publish or repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          fetch-depth: 0

      - name: Validate tag and version surfaces
        id: version
        shell: pwsh
        working-directory: source
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tag must match vX.Y.Z or vX.Y.Z-prerelease: $tag"
          }
          $version = $Matches.version
          $baseVersion = $version.Split('-')[0]
          $versionParts = $baseVersion.Split('.')
          $majorMinor = "$($versionParts[0]).$($versionParts[1])"
          $prerelease = $version.Contains('-').ToString().ToLowerInvariant()
          $sourceSha = (git rev-parse HEAD).Trim()
          $tagRef = "refs/tags/$tag"
          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -ne 0) {
            throw "Release input must name an existing tag: $tag"
          }
          $tagSha = (git rev-parse "${tagRef}^{commit}").Trim()
          if ($tagSha -ne $sourceSha) {
            throw "Checked-out source does not match $tagRef."
          }
          $serverVersion = (Select-String -Path server/internal/buildinfo/version.go -Pattern 'var Version = "([^"]+)"').Matches[0].Groups[1].Value
          $daemonVersion = (Select-String -Path daemon/internal/buildinfo/version.go -Pattern 'var Version = "([^"]+)"').Matches[0].Groups[1].Value
          $pwaVersion = (Get-Content -Raw pwa/package.json | ConvertFrom-Json).version
          foreach ($entry in @{
              server = $serverVersion
              daemon = $daemonVersion
              pwa = $pwaVersion
          }.GetEnumerator()) {
            if ($entry.Value -ne $version) {
              throw "$($entry.Key) version '$($entry.Value)' does not match tag '$tag'."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "major_minor=$majorMinor" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            source/relaycore/go.sum
            source/server/go.sum
            source/daemon/go.sum

      - name: Test Relay Core
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/relaycore
        run: go test -count=1 ./...

      - name: Vet Relay Core
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/relaycore
        run: go vet ./...

      - name: Test Server
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/server
        run: go test -count=1 ./...

      - name: Vet Server
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/server
        run: go vet ./...

      - name: Test Daemon
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/daemon
        run: go test -count=1 ./...

      - name: Vet Daemon
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/daemon
        run: go vet ./...

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.29.2"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: source/pwa/pnpm-lock.yaml

      - name: Install PWA dependencies
        working-directory: source/pwa
        run: pnpm install --frozen-lockfile

      - name: Test PWA
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/pwa
        run: pnpm test

      - name: Type-check PWA
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/pwa
        run: pnpm type-check

      - name: Build PWA
        working-directory: source/pwa
        run: pnpm build

      - name: Upload PWA build
        uses: actions/upload-artifact@v7
        with:
          name: pwa-dist
          path: source/pwa/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.component }} ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - component: server
            goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - component: daemon
            goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - component: daemon
            goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - component: daemon
            goos: windows
            goarch: amd64
            runner: windows-latest
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          path: source
          fetch-depth: 0

      - name: Verify pinned source commit
        shell: pwsh
        working-directory: source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) {
            throw "Source checkout moved: expected $env:EXPECTED_SOURCE_SHA, got $actual"
          }

      - name: Check out release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: automation

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: source/${{ matrix.component }}/go.sum

      - name: Download PWA build
        if: matrix.component == 'server'
        uses: actions/download-artifact@v7
        with:
          name: pwa-dist
          path: source/pwa/dist

      - name: Package binary
        shell: pwsh
        run: |
          $arguments = @{
            Component = "${{ matrix.component }}"
            TargetOS = "${{ matrix.goos }}"
            TargetArch = "${{ matrix.goarch }}"
            Version = "${{ needs.verify.outputs.version }}"
            RepositoryRoot = "${{ github.workspace }}/source"
            OutputDirectory = "${{ github.workspace }}/packages"
          }
          if ($arguments.Component -eq "server") {
            $arguments.PwaDirectory = "${{ github.workspace }}/source/pwa/dist"
          }
          & "${{ github.workspace }}/automation/tools/package-release.ps1" @arguments

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: packages/*
          if-no-files-found: error
          retention-days: 7

  container:
    name: Publish Server container
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/klarkxy/nekonest-server
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          path: source
          fetch-depth: 0

      - name: Verify pinned source commit
        shell: pwsh
        working-directory: source
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) {
            throw "Source checkout moved: expected $env:EXPECTED_SOURCE_SHA, got $actual"
          }

      - name: Check out release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: automation

      - name: Test release container tag policy
        shell: pwsh
        run: ./automation/tools/ghcr-release-tags.tests.ps1

      - name: Prepare trusted container automation
        shell: pwsh
        run: Copy-Item -LiteralPath automation/.dockerignore -Destination source/.dockerignore -Force

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse exact-tag rewrites
        id: preflight
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ./automation/tools/ghcr-release-tags.ps1 `
            -Mode preflight `
            -Image $env:IMAGE `
            -ReleaseTag $env:RELEASE_TAG `
            -Version $env:VERSION `
            -SourceSha $env:SOURCE_SHA

      - name: Repair missing immutable exact tag
        if: steps.preflight.outputs.skip == 'true' && steps.preflight.outputs.missing_exact != ''
        shell: bash
        env:
          SOURCE_REF: ${{ steps.preflight.outputs.source_ref }}
          MISSING_EXACT: ${{ steps.preflight.outputs.missing_exact }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:$MISSING_EXACT" "$SOURCE_REF"

      - name: Generate image metadata
        if: steps.preflight.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ needs.verify.outputs.version }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=NekoNest Server
            org.opencontainers.image.description=NekoNest VPS Server with the matching phone PWA
            org.opencontainers.image.source=https://github.com/klarkxy/nekonest
            org.opencontainers.image.revision=${{ needs.verify.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=SATA-2.0

      - name: Build and publish multi-architecture image
        if: steps.preflight.outputs.skip != 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: source
          file: automation/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.revision=${{ needs.verify.outputs.source_sha }}
            index:org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          build-args: VERSION=${{ needs.verify.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=server-container-release
          cache-to: type=gha,mode=max,scope=server-container-release

      - name: Verify immutable exact tags
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ./automation/tools/ghcr-release-tags.ps1 `
            -Mode verify-exact `
            -Image $env:IMAGE `
            -ReleaseTag $env:RELEASE_TAG `
            -Version $env:VERSION `
            -SourceSha $env:SOURCE_SHA

      - name: Advance stable aliases without rollback
        if: needs.verify.outputs.prerelease == 'false'
        id: aliases
        shell: pwsh
        env:
          MAJOR_MINOR: ${{ needs.verify.outputs.major_minor }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ./automation/tools/ghcr-release-tags.ps1 `
            -Mode promote `
            -Image $env:IMAGE `
            -ReleaseTag $env:RELEASE_TAG `
            -Version $env:VERSION `
            -MajorMinor $env:MAJOR_MINOR `
            -SourceSha $env:SOURCE_SHA

      - name: Log out of GHCR
        shell: pwsh
        run: docker logout ghcr.io

      - name: Verify anonymous immutable exact tags
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ./automation/tools/ghcr-release-tags.ps1 `
            -Mode verify-exact `
            -Image $env:IMAGE `
            -ReleaseTag $env:RELEASE_TAG `
            -Version $env:VERSION `
            -SourceSha $env:SOURCE_SHA

      - name: Verify anonymous stable aliases
        if: needs.verify.outputs.prerelease == 'false'
        shell: pwsh
        env:
          EXPECTED_LATEST_DIGEST: ${{ steps.aliases.outputs.latest_digest }}
          EXPECTED_MAJOR_MINOR_DIGEST: ${{ steps.aliases.outputs.major_minor_digest }}
          MAJOR_MINOR: ${{ needs.verify.outputs.major_minor }}
        run: |
          ./automation/tools/ghcr-release-tags.ps1 `
            -Mode verify-aliases `
            -Image $env:IMAGE `
            -MajorMinor $env:MAJOR_MINOR `
            -ExpectedMajorMinorDigest $env:EXPECTED_MAJOR_MINOR_DIGEST `
            -ExpectedLatestDigest $env:EXPECTED_LATEST_DIGEST

  publish:
    name: Publish GitHub Release assets
    needs:
      - verify
      - build
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          if [[ "${#assets[@]}" -ne 5 ]]; then
            echo "expected 5 release packages, found ${#assets[@]}" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum nekonest-* > checksums.txt
          )

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_flags=()
            if [[ "$PRERELEASE" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes \
              "${release_flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
