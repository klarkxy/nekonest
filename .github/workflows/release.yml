name: Release binaries

run-name: Release binaries for ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to publish or repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          fetch-depth: 0

      - name: Validate tag and version surfaces
        id: version
        shell: pwsh
        working-directory: source
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must match vX.Y.Z: $tag"
          }
          $version = $Matches.version
          $serverVersion = (Select-String -Path server/internal/buildinfo/version.go -Pattern 'var Version = "([^"]+)"').Matches[0].Groups[1].Value
          $daemonVersion = (Select-String -Path daemon/internal/buildinfo/version.go -Pattern 'var Version = "([^"]+)"').Matches[0].Groups[1].Value
          $pwaVersion = (Get-Content -Raw pwa/package.json | ConvertFrom-Json).version
          foreach ($entry in @{
              server = $serverVersion
              daemon = $daemonVersion
              pwa = $pwaVersion
          }.GetEnumerator()) {
            if ($entry.Value -ne $version) {
              throw "$($entry.Key) version '$($entry.Value)' does not match tag '$tag'."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: |
            source/server/go.sum
            source/daemon/go.sum

      - name: Test Server
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/server
        run: go test -count=1 ./...

      - name: Vet Server
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/server
        run: go vet ./...

      - name: Test Daemon
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/daemon
        run: go test -count=1 ./...

      - name: Vet Daemon
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/daemon
        run: go vet ./...

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.29.2"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: source/pwa/pnpm-lock.yaml

      - name: Install PWA dependencies
        working-directory: source/pwa
        run: pnpm install --frozen-lockfile

      - name: Test PWA
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/pwa
        run: pnpm test

      - name: Type-check PWA
        if: github.event_name != 'workflow_dispatch'
        working-directory: source/pwa
        run: pnpm type-check

      - name: Build PWA
        working-directory: source/pwa
        run: pnpm build

      - name: Upload PWA build
        uses: actions/upload-artifact@v7
        with:
          name: pwa-dist
          path: source/pwa/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.component }} ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - component: server
            goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - component: daemon
            goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - component: daemon
            goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - component: daemon
            goos: windows
            goarch: amd64
            runner: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          fetch-depth: 0

      - name: Check out release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: automation

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: source/${{ matrix.component }}/go.sum

      - name: Download PWA build
        if: matrix.component == 'server'
        uses: actions/download-artifact@v7
        with:
          name: pwa-dist
          path: source/pwa/dist

      - name: Package binary
        shell: pwsh
        run: |
          $arguments = @{
            Component = "${{ matrix.component }}"
            TargetOS = "${{ matrix.goos }}"
            TargetArch = "${{ matrix.goarch }}"
            Version = "${{ needs.verify.outputs.version }}"
            RepositoryRoot = "${{ github.workspace }}/source"
            OutputDirectory = "${{ github.workspace }}/packages"
          }
          if ($arguments.Component -eq "server") {
            $arguments.PwaDirectory = "${{ github.workspace }}/source/pwa/dist"
          }
          & "${{ github.workspace }}/automation/tools/package-release.ps1" @arguments

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.component }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: packages/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release assets
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f | sort)
          if [[ "${#assets[@]}" -ne 5 ]]; then
            echo "expected 5 release packages, found ${#assets[@]}" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum nekonest-* > checksums.txt
          )

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
