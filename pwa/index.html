<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#F8F1ED" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="猫娘窝" />
  <meta name="description" content="猫娘窝：从手机继续家里电脑上的线团。" />
  <meta property="og:title" content="猫娘窝" />
  <meta property="og:description" content="按工作目录和猫娘整理家里电脑上的线团。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/brand/nekonest-mark-1024.png" />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" type="image/png" sizes="192x192" href="/brand/pwa-192x192.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

  <title>猫娘窝</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f8f1ed;
      font-family: "Microsoft YaHei UI", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    }
    #app {
      min-height: 100vh;
      min-height: 100dvh;
    }
    .nekonest-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      color: #746975;
    }
    .nekonest-splash img {
      width: 84px;
      height: 84px;
      border-radius: 24px;
      box-shadow: 0 14px 34px rgba(92, 67, 92, 0.18);
      animation: breathe 1.4s ease-in-out infinite;
    }
    .nekonest-splash p {
      margin: 15px 0 0;
      color: #746975;
      font-size: 13px;
    }
    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.015); }
    }
    @media (prefers-reduced-motion: reduce) {
      .nekonest-splash img { animation: none; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="nekonest-splash">
      <img src="/brand/nekonest-duo.webp" alt="" width="84" height="84" />
      <p>正在打开猫娘乐园…</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
