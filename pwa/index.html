<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#B8A9E8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NekoNest" />
  <meta name="description" content="NekoNest 猫娘窝 - 远程控制你的 AI Coding Agent" />
  
  <!-- Favicon / PWA icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <title>NekoNest 猫娘窝</title>
  
  <style>
    /* Critical CSS - prevents FOUC */
    body {
      margin: 0;
      padding: 0;
      background-color: #FAF8F5;
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #app {
      min-height: 100vh;
    }
    /* Initial loading state */
    .nekonest-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #B8A9E8;
    }
    .nekonest-splash .cat {
      font-size: 48px;
      animation: bounce 1.2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .nekonest-splash .cat { animation: none; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="nekonest-splash">
      <div class="cat">🐱</div>
      <p style="margin-top: 16px; color: #9E9E9E; font-size: 14px;">猫娘窝加载中...</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
