<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="hair" x1="20" y1="10" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5F0"/>
      <stop offset="1" stop-color="#E8A0C8"/>
    </linearGradient>
    <linearGradient id="skin" x1="40" y1="40" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE8DC"/>
      <stop offset="1" stop-color="#FFD4C4"/>
    </linearGradient>
  </defs>
  <!-- soft plate -->
  <circle cx="64" cy="64" r="58" fill="#FAF8F5" stroke="#E8E0F5" stroke-width="2"/>
  <!-- hair back -->
  <ellipse cx="64" cy="72" rx="42" ry="46" fill="url(#hair)"/>
  <!-- cat ears -->
  <path d="M34 48 L28 14 L52 40 Z" fill="url(#hair)"/>
  <path d="M94 48 L100 14 L76 40 Z" fill="url(#hair)"/>
  <path d="M34 44 L32 22 L46 40 Z" fill="#FFB0C0"/>
  <path d="M94 44 L96 22 L82 40 Z" fill="#FFB0C0"/>
  <!-- face -->
  <ellipse cx="64" cy="70" rx="30" ry="28" fill="url(#skin)"/>
  <!-- bangs -->
  <path d="M36 58 Q50 42 64 48 Q78 42 92 58 Q88 50 64 46 Q40 50 36 58 Z" fill="url(#hair)"/>
  <!-- eyes -->
  <ellipse cx="52" cy="70" rx="5.5" ry="7" fill="#4A3A6A"/>
  <ellipse cx="76" cy="70" rx="5.5" ry="7" fill="#4A3A6A"/>
  <circle cx="54" cy="67" r="2" fill="white"/>
  <circle cx="78" cy="67" r="2" fill="white"/>
  <!-- blush -->
  <ellipse cx="44" cy="80" rx="6" ry="3.5" fill="#FFB0C0" opacity="0.55"/>
  <ellipse cx="84" cy="80" rx="6" ry="3.5" fill="#FFB0C0" opacity="0.55"/>
  <!-- nose + mouth -->
  <ellipse cx="64" cy="80" rx="2.2" ry="1.6" fill="#F090A0"/>
  <path d="M58 86 Q64 91 70 86" stroke="#C07080" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- ribbon -->
  <path d="M58 104 Q64 112 70 104" stroke="#E890B0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="64" cy="104" r="3" fill="#E890B0"/>
</svg>
